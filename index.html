<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to e-Vakalatnama</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .phone-frame {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
        }

        /* Geometric background pattern */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e8f0fe 100%);
            z-index: 0;
            overflow: hidden;
        }

        .bg-pattern::before,
        .bg-pattern::after {
            content: '';
            position: absolute;
            background: rgba(30, 82, 183, 0.06);
            transform: rotate(-25deg);
        }

        .bg-pattern::before {
            width: 280px;
            height: 280px;
            top: -80px;
            right: -60px;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }

        .bg-pattern::after {
            width: 220px;
            height: 220px;
            bottom: -40px;
            left: -50px;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            background: rgba(22, 76, 159, 0.05);
        }

        /* Extra geometric shapes */
        .shape {
            position: absolute;
            background: rgba(30, 82, 183, 0.04);
            z-index: 0;
        }

        .shape-1 {
            width: 180px;
            height: 180px;
            top: 120px;
            left: -40px;
            transform: rotate(35deg);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
        }

        .shape-2 {
            width: 140px;
            height: 140px;
            bottom: 180px;
            right: -30px;
            transform: rotate(-20deg);
            border-radius: 50% 50% 30% 70% / 50% 50% 70% 30%;
        }

        .shape-3 {
            width: 100px;
            height: 100px;
            top: 40%;
            right: 20px;
            transform: rotate(15deg);
            background: rgba(22, 76, 159, 0.03);
            border-radius: 40% 60% 60% 40% / 60% 30% 70% 40%;
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 48px 32px 40px;
        }

        /* Top blue accent */
        .top-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #164c9f, #1e52b7, #2563eb);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        h1 span {
            color: #1e52b7;
            display: block;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .divider-line {
            width: 40px;
            height: 3px;
            background: #1e52b7;
            border-radius: 2px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: #1e52b7;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(30, 82, 183, 0.12);
        }

        .input-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8f0fe;
            color: #1e52b7;
            flex-shrink: 0;
        }

        .input-icon svg {
            width: 20px;
            height: 20px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 14px 16px;
            font-size: 15px;
            color: #1e293b;
            font-family: inherit;
        }

        input::placeholder {
            color: #94a3b8;
        }

        .password-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .forgot-link {
            font-size: 13px;
            color: #1e52b7;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0 28px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1e52b7;
            cursor: pointer;
        }

        .remember-me span {
            font-size: 14px;
            color: #475569;
        }

        .btn-primary {
            width: 100%;
            background: #164c9f;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-bottom: 14px;
        }

        .btn-primary:hover {
            background: #123d80;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(22, 76, 159, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: #1e52b7;
            border: 1.5px solid #93c5fd;
            border-radius: 12px;
            padding: 15px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-bottom: 28px;
        }

        .btn-secondary:hover {
            background: #eff6ff;
            border-color: #1e52b7;
        }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .or-divider span {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        .signup-text {
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        .signup-text a {
            color: #1e52b7;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* Responsive adjustments */
        @media (max-width: 420px) {
            .container {
                padding: 40px 24px 32px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="bg-pattern">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        
        <div class="top-accent"></div>

        <div class="container">
            <h1>
                Sign in to
                <span>e-Vakalatnama</span>
            </h1>
            <p class="subtitle">Enter your credentials to access your workspace.</p>
            
            <div class="divider-line"></div>

            <form onsubmit="event.preventDefault(); alert('Sign In clicked (demo)');">
                <div class="form-group">
                    <label for="email">Mobile or Email</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text" id="email" placeholder="Enter mobile or email" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="password-header">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>
                </div>

                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    <span>Remember me</span>
                </label>

                <button type="submit" class="btn-primary">
                    SIGN IN
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                    </svg>
                </button>

                <button type="button" class="btn-secondary" onclick="alert('Login with OTP clicked (demo)')">
                    LOGIN WITH OTP
                </button>
            </form>

            <div class="or-divider">
                <span>OR</span>
            </div>

            <p class="signup-text">
                Don't have an account? 
                <a href="#">Create<br>New Account</a>
            </p>
        </div>
    </div>
</body>
</html>
